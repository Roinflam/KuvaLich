modLoader="javafml"
loaderVersion="[${forge_loader_version},)"
license="${mod_license}"

[[mods]]
modId="kuvalich"
version="${version}"
displayName="${mod_name}"
updateJSONURL="https://www.curseforge.com/minecraft/mc-mods/kuvalich"
displayURL="https://www.curseforge.com/minecraft/mc-mods/kuvalich"
logoFile=""
credits="特别感谢 白狐大小姐 为本项目提供的支持和帮助"
authors="${mod_author}"
description='''
Warframe!
'''

[[dependencies.kuvalich]]
modId="forge"
mandatory=true
versionRange="[${forge_loader_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.kuvalich]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.kuvalich]]
modId="geckolib"
mandatory=true
versionRange="[4.4,)"
ordering="AFTER"
side="BOTH"

[[dependencies.kuvalich]]
modId="patchouli"
mandatory=false
versionRange="[1.20.1-84,)"
ordering="AFTER"
side="BOTH"

[[dependencies.kuvalich]]
modId="tacz"
# 可选：没装 TACZ 时本模组的枪械相关功能整体静默关闭，不影响近战与战甲系统。
# ⚠️ 改这里必须同步改 kuvalich.tacz.mixins.json 的 "required"：
#    那份配置若为 true，TACZ 缺席时 mixin 应用失败会直接崩，比缺前置提示屏更糟。
mandatory=false
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.kuvalich]]
modId="cloth_config"
mandatory=false
versionRange="[11.0.0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.kuvalich]]
modId="curios"
mandatory=false
versionRange="[5.9.1,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config = "kuvalich.mixins.json"

[[mixins]]
config = "kuvalich.tacz.mixins.json"
