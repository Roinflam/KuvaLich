modLoader="javafml"
loaderVersion="[${forge_loader_version},)"
license="${mod_license}"

[[mods]]
modId="kuvalich"
version="${version}"
displayName="${mod_name}"
# updateJSONURL 已去掉：这个字段要的是 Forge 版本检查用的 update JSON，
# 原先填的是 CurseForge 的网页地址，Forge 拉回来一段 HTML 去解析 JSON，
# 每次启动都抛一条 JsonSyntaxException（Expected BEGIN_OBJECT but was STRING）。
# 本项目没有托管 update JSON，省掉这行即可关掉版本检查。
# 将来真要开，格式见 https://docs.minecraftforge.net/en/1.20.1/misc/updatechecker/
displayURL="https://www.curseforge.com/minecraft/mc-mods/kuvalich"
logoFile=""
credits="特别感谢 白狐大小姐 为本项目提供的支持和帮助。内嵌 shedaniel 的 Cloth Config API（GNU LGPLv3）和 GeckoLib（MIT），均未作修改，以独立 jar-in-jar 形式提供。《Warframe》（星际战甲）是 Digital Extremes 的商标，本模组为非官方同人作品，与其无关联。 / Cloth Config API by shedaniel (GNU LGPLv3) and GeckoLib (MIT) are bundled unmodified as separate jar-in-jar libraries. Warframe is a trademark of Digital Extremes Ltd.; this is an unofficial fan-made mod and is not affiliated with them."
authors="${mod_author}"
description='''
Warframe!
'''

[[dependencies.kuvalich]]
modId="forge"
mandatory=true
versionRange="[${forge_loader_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.kuvalich]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.kuvalich]]
modId="geckolib"
mandatory=true
versionRange="[4.4,)"
ordering="AFTER"
side="BOTH"

[[dependencies.kuvalich]]
modId="tacz"
# 可选：没装 TACZ 时本模组的枪械相关功能整体静默关闭，不影响近战与战甲系统。
# 注意：改这里必须同步改 kuvalich.tacz.mixins.json 的 "required"：
#    那份配置若为 true，TACZ 缺席时 mixin 应用失败会直接崩，比缺前置提示屏更糟。
mandatory=false
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.kuvalich]]
modId="cloth_config"
mandatory=false
versionRange="[11.0.0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.kuvalich]]
modId="curios"
mandatory=false
versionRange="[5.9.1,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config = "kuvalich.mixins.json"

[[mixins]]
config = "kuvalich.tacz.mixins.json"
