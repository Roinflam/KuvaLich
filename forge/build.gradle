plugins {
    // Shadow 插件：用于将 common 模块的代码合并到 forge jar 中
    id 'com.github.johnrengelman.shadow'
}

repositories {
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    mavenCentral()
}

loom {
    forge {
        mixinConfig "${rootProject.mod_id}.mixins.json"
        mixinConfig "${rootProject.mod_id}.tacz.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

// ========== 自动解析 JiJ 依赖的输出目录 ==========
def jijExtractDir = file("${buildDir}/extracted-jij")

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
    // 用于存放需要提取 JiJ 的 jar（即 dependencies 目录下所有 jar）
    jijSource {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // ==================== 核心依赖（必需） ====================
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // ==================== API 依赖 ====================

    // GeckoLib
    include 'software.bernie.geckolib:geckolib-forge-1.20.1:4.8.2'
    modImplementation 'software.bernie.geckolib:geckolib-forge-1.20.1:4.8.2'
    forgeRuntimeLibrary 'com.eliotlash.mclib:mclib:20'

    // Cloth Config
    modApi "me.shedaniel.cloth:cloth-config-forge:11.1.136"
    include "me.shedaniel.cloth:cloth-config-forge:11.1.136"

    // ==================== MixinExtras ====================
    // 我们自己声明 0.5.0，提取 JiJ 时会跳过 tacz 内置的旧版本，避免模块冲突
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-forge:0.5.0"))

    // ==================== Common 模块（必需） ====================
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // ==================== 本地 jar 依赖 ====================
    // forge/dependencies/ 目录下所有 jar：加入运行时 + 注册为 JiJ 提取源
    fileTree(dir: 'dependencies', include: '*.jar').each { File file ->
        modApi(files(file))
        jijSource(files(file))
    }
}

// ========== 提取所有本地 jar 内部的 JiJ 依赖 ==========
task extractAllJiJ {
    outputs.dir jijExtractDir

    doLast {
        jijExtractDir.mkdirs()

        configurations.jijSource.files.each { File jar ->
            logger.lifecycle("正在扫描 ${jar.name} 的 JiJ 依赖...")

            try {
                def nested = zipTree(jar).matching {
                    include 'META-INF/jarjar/*.jar'
                }
                nested.forEach { File nestedJar ->
                    // 跳过 mixinextras，我们自己已经声明了更高版本，避免模块冲突
                    if (nestedJar.name.toLowerCase().contains('mixinextras')) {
                        logger.lifecycle("  跳过（已手动声明）: ${nestedJar.name}")
                        return
                    }
                    def dest = new File(jijExtractDir, nestedJar.name)
                    if (!dest.exists()) {
                        dest.bytes = nestedJar.bytes
                        logger.lifecycle("  提取: ${nestedJar.name}")
                    } else {
                        logger.lifecycle("  已存在，跳过: ${nestedJar.name}")
                    }
                }
            } catch (Exception e) {
                logger.warn("  扫描 ${jar.name} 时出错：${e.message}")
            }
        }

        logger.lifecycle("JiJ 提取完成，共提取到 ${jijExtractDir.listFiles()?.length ?: 0} 个 jar")
    }
}

// 编译前先提取 JiJ
compileJava.dependsOn extractAllJiJ

// 将提取出来的所有 jar 加入运行时类路径
afterEvaluate {
    if (jijExtractDir.exists()) {
        fileTree(dir: jijExtractDir, include: '*.jar').each { File jar ->
            logger.lifecycle("加载 JiJ 依赖: ${jar.name}")
            dependencies {
                forgeRuntimeLibrary files(jar)
            }
        }
    }
}

processResources {
    inputs.property 'mod_id', rootProject.mod_id
    inputs.property 'mod_name', rootProject.mod_name
    inputs.property 'version', project.version
    inputs.property 'mod_author', rootProject.mod_author
    inputs.property 'mod_license', rootProject.mod_license
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'forge_loader_version', rootProject.forge_loader_version

    filesMatching('META-INF/mods.toml') {
        expand(
                'mod_id': rootProject.mod_id,
                'mod_name': rootProject.mod_name,
                'version': project.version,
                'mod_author': rootProject.mod_author,
                'mod_license': rootProject.mod_license,
                'minecraft_version': rootProject.minecraft_version,
                'forge_loader_version': rootProject.forge_loader_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}