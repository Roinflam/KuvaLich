# ==================== Gradle Settings ====================
# JVM Arguments
# -Xmx4G: Sets the maximum heap memory for Gradle daemon JVM to 4GB, prevents OOM errors
# -Dfile.encoding=UTF-8: Forces file encoding to UTF-8 to avoid garbled characters
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8

# Enable Gradle parallel builds
# Allows multiple tasks to run concurrently
# Set to false if build order dependencies cause issues
org.gradle.parallel=true

# ==================== Mod Identity ====================
# Mod ID
# Must be unique and lowercase
# Determines the paths for assets/mod_id and data/mod_id directories
# Do not change the Mod ID after publishing
mod_id=kuvalich

# Mod Display Name
# Shown in the mod list; can include spaces and capitalization
mod_name=KuvaLich

# Mod Version
# Follows Semantic Versioning: major.minor.patch
# Increment the version on every release
# Attach a pre-release suffix for beta/snapshot builds
# Reviewers will check this to verify bug fixes
mod_version=2.5.0

# Maven Group ID
# Used for Maven packaging, e.g. com.example for organizations (or pers.username for personal)
# Must be a valid Maven group identifier
maven_group=pers.roinflam

# ==================== Mod Metadata ====================
# Mod Author
# The name displayed in the mod info screen
mod_author=Roinflam

# License
# Specifies the mod's license (e.g. MIT, GPL-3.0, Apache-2.0, All Rights Reserved, etc.)
# For Custom License, describe the terms separately and include a LICENSE file
mod_license=Custom License

# ==================== Minecraft & Forge Versions ====================
# Target Minecraft Version
# The Minecraft version this mod is built and tested against
minecraft_version=1.20.1

# Forge Version
# Format: minecraft_version-forge_version
# Check available versions at https://files.minecraftforge.net/
# Forge APIs may vary across versions; ensure compatibility before upgrading
forge_version=1.20.1-47.4.13

# Forge Loader Version Range
# Used in mods.toml metadata
# e.g. loaderVersion="[47,)" means compatible with Forge 47.x and above
# The major version is derived from forge_version (47.4.13 ? 47)
forge_loader_version=47

# ==================== Multi-platform Settings ====================
# Enabled Platforms
# Options: forge, fabric, quilt, or a combination separated by commas
# When using Architectury for multi-platform builds, Forge is the primary target
enabled_platforms=forge

# Architectury API Version
# The version of the Architectury abstraction API
# Must match the target Minecraft version; see: https://modrinth.com/mod/architectury-api
architectury_api_version=9.2.14

# Fabric Loader Version
# Only required when targeting the Fabric platform; unused for Forge-only builds
# Check latest versions at: https://fabricmc.net/develop/
fabric_loader_version=0.18.4

# Fabric API Version
# The Fabric standard library required for Fabric builds
# Format: api_version+minecraft_version
# Check latest versions at: https://modrinth.com/mod/fabric-api
fabric_api_version=0.92.6+1.20.1

# ==================== GeckoLib Settings ====================
# GeckoLib version, used for entity and block animations
# Check latest versions at: https://www.curseforge.com/minecraft/mc-mods/geckolib
geckolib_version=4.4

# ==================== Curios Settings ====================
# Curios API ??????????
# ???????https://www.curseforge.com/minecraft/mc-mods/curios/files
curios_version=5.9.1+1.20.1